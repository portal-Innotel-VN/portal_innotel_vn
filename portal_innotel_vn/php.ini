asp_tags = Off
display_errors = On
max_execution_time = 90
max_input_time = 90
max_input_vars = 1000
memory_limit = 300M
post_max_size = 64M
session.gc_maxlifetime = 1440
session.save_path = "/tmp"
upload_max_filesize = 64M
zlib.output_compression = Off
